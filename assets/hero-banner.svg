<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.32" />
    </pattern>

    <clipPath id="bannerClip">
      <rect width="1200" height="360" rx="20" />
    </clipPath>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 38px; fill: #f8fafc; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 700; font-size: 14.5px; fill: #38bdf8; letter-spacing: 2.2px; }
    .desc { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 400; font-size: 14.5px; fill: #94a3b8; }
    .code { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 12.5px; }
    .badge-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 600; font-size: 11.5px; fill: #e2e8f0; letter-spacing: 0.5px; }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <g clip-path="url(#bannerClip)">
    <!-- Main Rounded Background -->
    <rect width="1200" height="360" rx="20" fill="url(#bgGrad)" />
    <rect width="1200" height="360" rx="20" fill="url(#grid)" />
    <rect width="1200" height="360" rx="20" fill="url(#glow1)" />
    <rect width="1200" height="360" rx="20" fill="url(#glow2)" />

    <!-- Subtle Decorative Wave at Bottom -->
    <path d="M 0 310 Q 300 280 600 315 T 1200 300 L 1200 360 L 0 360 Z" fill="url(#waveGrad1)" />

    <!-- Decorative Top Accent Line -->
    <rect x="60" y="0" width="1080" height="4" fill="url(#accentGrad)" opacity="0.9" />

    <!-- Left Column: Identity & Value Proposition (x=48..620) -->
    <g transform="translate(48, 44)">
      <!-- Status Pill -->
      <rect x="0" y="0" width="420" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
      <circle cx="18" cy="16" r="5" fill="#10b981" class="pulse-dot" />
      <text x="34" y="20" class="badge-text">SHIPPING PRODUCTION APPS @ DEWIBE • TASHKENT, UZ</text>

      <!-- Role Header -->
      <text x="0" y="66" class="subtitle">FLUTTER &amp; FULL-STACK SOFTWARE ENGINEER</text>

      <!-- Main Name -->
      <text x="0" y="112" class="title">Abduqahhor Abduganiyev</text>

      <!-- Bio Summary -->
      <text x="0" y="148" class="desc">Architecting production-grade <tspan fill="#38bdf8" font-weight="600">Flutter</tspan> mobile apps, scalable <tspan fill="#818cf8" font-weight="600">FastAPI &amp; Serverpod</tspan></text>
      <text x="0" y="170" class="desc">backends, and autonomous <tspan fill="#c084fc" font-weight="600">AI &amp; Telegram Mini App</tspan> ecosystems at <tspan fill="#f8fafc" font-weight="700">@DEWIBE</tspan>.</text>

      <!-- Key Metric Pills -->
      <g transform="translate(0, 204)">
        <!-- Pill 1 -->
        <rect x="0" y="0" width="174" height="54" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="16.5" fill="#38bdf8">10+ Shipped</text>
        <text x="16" y="42" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">Production Systems</text>

        <!-- Pill 2 -->
        <rect x="188" y="0" width="184" height="54" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="204" y="24" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="16.5" fill="#818cf8">iOS • Android • Web</text>
        <text x="204" y="42" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">Cross-Platform Mastery</text>

        <!-- Pill 3 -->
        <rect x="386" y="0" width="188" height="54" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
        <text x="402" y="24" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="16.5" fill="#c084fc">Mobile + Backend + AI</text>
        <text x="402" y="42" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">End-to-End Engineering</text>
      </g>
    </g>

    <!-- Right Column: Developer Terminal Card (Fixed at x=654, y=42 - no CSS transform overwrite!) -->
    <g transform="translate(654, 42)">
      <!-- Outer Subtle Border Glow -->
      <rect x="-2" y="-2" width="502" height="274" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.45" />
      <!-- Terminal Window -->
      <rect x="0" y="0" width="498" height="270" rx="14" fill="#090d16" stroke="#334155" stroke-width="1.5" />
      <!-- Terminal Header Bar -->
      <path d="M 0 14 Q 0 0 14 0 L 484 0 Q 498 0 498 14 L 498 38 L 0 38 Z" fill="#161f30" />
      <circle cx="20" cy="19" r="6" fill="#ef4444" />
      <circle cx="40" cy="19" r="6" fill="#f59e0b" />
      <circle cx="60" cy="19" r="6" fill="#10b981" />
      <text x="249" y="23" text-anchor="middle" class="code" fill="#64748b" font-size="12">abduqahhor@dewibe-hq: ~/profile.dart</text>

      <!-- Terminal Code Content -->
      <g transform="translate(22, 64)" class="code">
        <text x="0" y="0" fill="#c084fc">class <tspan fill="#38bdf8">SoftwareEngineer</tspan> <tspan fill="#e2e8f0">extends</tspan> <tspan fill="#34d399">Architect</tspan> <tspan fill="#e2e8f0">{</tspan></text>
        <text x="16" y="25" fill="#94a3b8">final String <tspan fill="#e2e8f0">name</tspan>    = <tspan fill="#fde047">'Abduqahhor Abduganiyev'</tspan>;</text>
        <text x="16" y="48" fill="#94a3b8">final String <tspan fill="#e2e8f0">company</tspan> = <tspan fill="#fde047">'DEWIBE IT Agency (@dewibeuz)'</tspan>;</text>
        <text x="16" y="71" fill="#94a3b8">final List   <tspan fill="#e2e8f0">mobile</tspan>  = [<tspan fill="#38bdf8">'Flutter'</tspan>, <tspan fill="#38bdf8">'Dart'</tspan>, <tspan fill="#38bdf8">'BLoC'</tspan>, <tspan fill="#38bdf8">'CleanArch'</tspan>];</text>
        <text x="16" y="94" fill="#94a3b8">final List   <tspan fill="#e2e8f0">backend</tspan> = [<tspan fill="#818cf8">'FastAPI'</tspan>, <tspan fill="#818cf8">'Serverpod'</tspan>, <tspan fill="#818cf8">'Django'</tspan>];</text>
        <text x="16" y="117" fill="#94a3b8">final List   <tspan fill="#e2e8f0">shipped</tspan> = [<tspan fill="#34d399">'UzCure'</tspan>, <tspan fill="#34d399">'BarakaPOS'</tspan>, <tspan fill="#34d399">'UzRent'</tspan>, <tspan fill="#34d399">'TeleSeller'</tspan>];</text>
        <text x="16" y="143" fill="#c084fc">Future&lt;Impact&gt; <tspan fill="#60a5fa">ship</tspan><tspan fill="#e2e8f0">() =&gt; deployProduction(quality: </tspan><tspan fill="#f472b6">100</tspan><tspan fill="#e2e8f0">);</tspan></text>
        <text x="0" y="166" fill="#e2e8f0">}</text>
        <text x="0" y="191" fill="#10b981">➜ <tspan fill="#38bdf8">~</tspan> <tspan fill="#e2e8f0">flutter build ipa &amp;&amp; docker compose up -d</tspan></text>
        <rect x="358" y="178" width="8" height="15" fill="#38bdf8" class="cursor" />
      </g>
    </g>
  </g>

  <!-- Outer Border -->
  <rect width="1200" height="360" rx="20" fill="none" stroke="#1e293b" stroke-width="2" />
</svg>
