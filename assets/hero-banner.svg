<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="flutterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02569B" />
      <stop offset="100%" stop-color="#13B9FD" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 38px; fill: #f8fafc; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 600; font-size: 16px; fill: url(#accentGrad); letter-spacing: 2.5px; }
    .desc { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 400; font-size: 14.5px; fill: #94a3b8; }
    .code { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 13px; }
    .badge-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #e2e8f0; }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    .float-slow { animation: float 6s infinite ease-in-out; }
    .float-fast { animation: float 4s infinite ease-in-out reverse; }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; r: 5px; }
      50% { opacity: 0.4; r: 7px; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Main Rounded Container -->
  <rect width="1200" height="340" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect width="1200" height="340" rx="20" fill="url(#grid)" />
  <rect width="1200" height="340" rx="20" fill="url(#glow1)" />
  <rect width="1200" height="340" rx="20" fill="url(#glow2)" />

  <!-- Decorative Top Accent Line -->
  <rect x="60" y="0" width="1080" height="3" fill="url(#accentGrad)" opacity="0.85" />

  <!-- Left Column: Identity & Value Proposition -->
  <g transform="translate(56, 46)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="350" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.45" />
    <circle cx="18" cy="15" r="5" fill="#10b981" class="pulse-dot" />
    <text x="34" y="19" class="badge-text" fill="#cbd5e1">AVAILABLE FOR HIGH-IMPACT PROJECTS • TASHKENT 🇺🇿</text>

    <!-- Role Header -->
    <text x="0" y="64" class="subtitle">FLUTTER &amp; FULL-STACK ENGINEER</text>

    <!-- Main Name -->
    <text x="0" y="110" class="title">Abduqahhor Abduganiyev</text>

    <!-- Bio Summary -->
    <text x="0" y="144" class="desc">Architecting production-grade <tspan fill="#38bdf8" font-weight="600">Flutter</tspan> mobile apps, scalable <tspan fill="#818cf8" font-weight="600">FastAPI / Serverpod</tspan></text>
    <text x="0" y="166" class="desc">backends, and autonomous <tspan fill="#c084fc" font-weight="600">AI &amp; Telegram Mini App</tspan> ecosystems at <tspan fill="#f8fafc" font-weight="700">@DEWIBE</tspan>.</text>

    <!-- Key Metric Pills -->
    <g transform="translate(0, 196)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="168" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="16" y="21" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="17" fill="#38bdf8">10+ Shipped</text>
      <text x="16" y="38" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">Production Systems</text>

      <!-- Pill 2 -->
      <rect x="182" y="0" width="182" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="198" y="21" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="17" fill="#818cf8">iOS • Android • Web</text>
      <text x="198" y="38" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">Cross-Platform Mastery</text>

      <!-- Pill 3 -->
      <rect x="378" y="0" width="182" height="48" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="394" y="21" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="17" fill="#c084fc">Mobile + Backend + AI</text>
      <text x="394" y="38" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">End-to-End Engineering</text>
    </g>
  </g>

  <!-- Right Column: Animated Developer Terminal Card -->
  <g transform="translate(668, 36)" class="float-slow">
    <!-- Glow behind terminal -->
    <rect x="-4" y="-4" width="484" height="268" rx="16" fill="url(#accentGrad)" opacity="0.15" filter="url(#softGlow)" />
    <!-- Terminal Window -->
    <rect x="0" y="0" width="476" height="260" rx="14" fill="#090d16" stroke="#334155" stroke-width="1.5" />
    <!-- Terminal Header Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 462 0 Q 476 0 476 14 L 476 36 L 0 36 Z" fill="#161f30" />
    <circle cx="20" cy="18" r="6" fill="#ef4444" />
    <circle cx="40" cy="18" r="6" fill="#f59e0b" />
    <circle cx="60" cy="18" r="6" fill="#10b981" />
    <text x="238" y="22" text-anchor="middle" class="code" fill="#64748b" font-size="12">abduqahhor@dewibe-hq: ~/profile.dart</text>

    <!-- Terminal Code Content -->
    <g transform="translate(22, 60)" class="code">
      <text x="0" y="0" fill="#c084fc">class <tspan fill="#38bdf8">SoftwareEngineer</tspan> <tspan fill="#e2e8f0">extends</tspan> <tspan fill="#34d399">Builder</tspan> <tspan fill="#e2e8f0">{</tspan></text>
      <text x="18" y="24" fill="#94a3b8">final String <tspan fill="#e2e8f0">name</tspan>     = <tspan fill="#fde047">'Abduqahhor Abduganiyev'</tspan>;</text>
      <text x="18" y="46" fill="#94a3b8">final String <tspan fill="#e2e8f0">team</tspan>     = <tspan fill="#fde047">'DEWIBE IT Agency (@dewibeuz)'</tspan>;</text>
      <text x="18" y="68" fill="#94a3b8">final List   <tspan fill="#e2e8f0">mobile</tspan>   = [<tspan fill="#38bdf8">'Flutter'</tspan>, <tspan fill="#38bdf8">'Dart'</tspan>, <tspan fill="#38bdf8">'BLoC'</tspan>, <tspan fill="#38bdf8">'CleanArch'</tspan>];</text>
      <text x="18" y="90" fill="#94a3b8">final List   <tspan fill="#e2e8f0">backend</tspan>  = [<tspan fill="#818cf8">'FastAPI'</tspan>, <tspan fill="#818cf8">'Serverpod'</tspan>, <tspan fill="#818cf8">'Django'</tspan>];</text>
      <text x="18" y="112" fill="#94a3b8">final List   <tspan fill="#e2e8f0">shipped</tspan>  = [<tspan fill="#34d399">'UzCure'</tspan>, <tspan fill="#34d399">'BarakaPOS'</tspan>, <tspan fill="#34d399">'UzRent'</tspan>, <tspan fill="#34d399">'TeleSellerAI'</tspan>];</text>
      <text x="18" y="138" fill="#c084fc">Future&lt;Impact&gt; <tspan fill="#60a5fa">ship</tspan><tspan fill="#e2e8f0">() =&gt; buildScalableProduct(quality: </tspan><tspan fill="#f472b6">100</tspan><tspan fill="#e2e8f0">);</tspan></text>
      <text x="0" y="160" fill="#e2e8f0">}</text>
      <text x="0" y="184" fill="#10b981">➜ <tspan fill="#38bdf8">~</tspan> <tspan fill="#e2e8f0">flutter build ipa &amp;&amp; docker compose up -d</tspan></text>
      <rect x="366" y="172" width="8" height="15" fill="#38bdf8" class="cursor" />
    </g>
  </g>
</svg>
